apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-default-deny-ingress
  namespace: lca-runtimes
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # 严格拒绝所有入站连接（Runtime 仅向 Control API 发起主动长连接）
  ingress: []
  # 出站连接仅允许 DNS 解析与受控的外部 HTTPS / WSS 端口
  egress:
    # 允许集群内部 DNS 解析
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 允许向外部控制服务器建立安全 WSS 连接 (443 端口)
    - to: []
      ports:
        - protocol: TCP
          port: 443
