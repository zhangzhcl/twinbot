apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-pvc-user-a
  namespace: lca-runtimes
  labels:
    twinbot.user: user-a
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
